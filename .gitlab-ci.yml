workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/'
      variables:
        PIPELINE_PRODUCTION: "true"
        APPLICATION_URL: "https://potter.ilcs.co.id"

include:
  - project: "infracloud/utils"
    ref: main
    file: "/kubernetes-ci-template.yaml"
